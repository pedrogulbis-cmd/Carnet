/* ============================================================
   ACTIONS
   ============================================================ */
function ouvrirModal(m){ state.modal = m; render(); }
function fermerModal(){ state.modal = null; render(); }
const val = id => { const e = document.getElementById(id); return e ? e.value : ""; };
const entier = id => { const v = parseInt(String(val(id)).replace(/[^\d-]/g,""), 10); return isNaN(v) ? 0 : v; };

/* Basculer un champ redessine la modale : sans relever la saisie en cours,
   une recherche à moitié tapée disparaîtrait. */
function capturerModal(){
  const m = state.modal;
  if(!m) return;
  if(m.type === "vehicule"){
    if(document.getElementById("m-q")) m.q = val("m-q");
    if(document.getElementById("m-mec")) m.mec = val("m-mec");
    if(document.getElementById("m-boite")) m.boite = val("m-boite");
    if(document.getElementById("m-finition")) m.finition = val("m-finition");
    if(document.getElementById("m-prix")) m.prix = cents(val("m-prix"));
    if(document.getElementById("m-km")) m.km = entier("m-km");
    if(m.etape === "manuel"){
      m.marque = val("m-marque"); m.modele = val("m-modele");
      m.version = val("m-version"); m.energie = val("m-energie");
    }
  }
  if(m.type === "km"){ m.km = entier("m-km"); m.date = val("m-date"); }
  if(m.type === "acte"){
    m.ope = val("m-ope"); m.titre = val("m-titre"); m.date = val("m-date");
    m.km = entier("m-km"); m.cout = val("m-cout"); m.note = val("m-note");
  }
  if(m.type === "ct"){ m.ct = val("m-ct"); m.res = val("m-ctres"); }
}

/* Une motorisation choisie au catalogue renseigne quatre choses d'un coup :
   l'énergie et la distribution, qui décident des opérations du plan, son
   intervalle, qui décide de leur date, et le prix du neuf, qui lance la cote.
   Un prix déjà saisi n'est jamais écrasé. */
function appliquerModele(v, marque, modele, mo){
  v.marque = marque || v.marque;
  v.modele = modele || v.modele;
  if(!mo) return;
  v.version = mo.n;
  v.energie = mo.energie;
  v.distrib = mo.distrib;
  if(mo.prix && !v.prixNeuf) v.prixNeuf = Math.round(mo.prix * coefFinition(v.marque, v.finition));
  v.plan = v.plan || {};
  if(mo.dk || mo.dm) v.plan.distribution = { km:mo.dk || "", mois:mo.dm || "", off:false };
  else delete v.plan.distribution;
}
function creerVehicule(o){
  const v = { id:uid(), marque:"", modele:"", version:"", finition:o.finition || "",
    genre:"vp", energie:"essence",
    boite:o.boite || "manuelle", distrib:"inconnu", regime:"normal", mec:o.mec || "",
    km:Math.max(0, o.km || 0), kmDate:todayISO(), kmAn:0, revDate:"", revKm:0,
    ctDernier:"", ctResultat:"ok", prixNeuf:0, coteMan:0, plan:{}, note:"", cree:Date.now() };
  appliquerModele(v, o.marque, o.modele, o.moto);
  if(o.prixNeuf > 0) v.prixNeuf = o.prixNeuf;   // un prix saisi prime toujours sur l'estimation
  if(o.energie) v.energie = o.energie;
  if(o.version) v.version = o.version;
  DB.vehicules[v.id] = v;
  DB.settings.actif = v.id;
  sauverVehicule(v); sauver(true);
  return v;
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act]");
  if(!t){
    // Toucher le fond d'une modale la ferme ; toucher la modale elle-même non.
    if(ev.target.closest("[data-stop]")) return;
    return;
  }
  const act = t.dataset.act, id = t.dataset.id;
  if(act === "fermer-modal" && ev.target.closest("[data-stop]") && ev.target !== t) return;

  /* ---- navigation ---- */
  if(act === "tab"){ state.tab = id; state.limite = 40; render(); window.scrollTo(0,0); return; }
  if(act === "basculer-masque"){ DB.settings.masque = !DB.settings.masque; sauver(true); render(); return; }
  if(act === "vehicule-suivant"){
    const l = vehicules();
    if(l.length < 2) return;
    const i = l.findIndex(x => x.id === DB.settings.actif);
    DB.settings.actif = l[(i+1) % l.length].id;
    sauver(true); render();
    toast(nomVehicule(vActif()) + (libMoteur(vActif()) ? " — " + libMoteur(vActif()) : ""));
    return;
  }
  if(act === "plus"){ state.limite += 40; render(); return; }
  if(act === "horizon"){ DB.settings.horizon = parseInt(id,10) || 10; sauver(true); render(); return; }
  if(act === "basculer-journal"){ state.journal = !state.journal; render(); return; }
  if(act === "journal-ouvrir"){ ouvrirModal({ type:"journal" }); return; }
  if(act === "journal-vu"){ DB.meta.vue = VERSION; state.neuf = false; sauver(true); fermerModal(); return; }
  if(act === "fermer-modal"){ fermerModal(); return; }
  if(act === "fiche-fermer"){ state.fiche = null; render(); return; }
  if(act === "fiche-ouvrir"){ state.fiche = id; render(); return; }

  /* ---- véhicules ---- */
  if(act === "vehicule-nouveau"){ ouvrirModal({ type:"vehicule", etape:"modele", q:"", focus:"m-q" }); return; }
  if(act === "cat-ouvrir"){ ouvrirModal({ type:"vehicule", cible:id, etape:"modele", q:"", focus:"m-q" }); return; }
  if(act === "cat-marque"){
    state.modal.marque = id; state.modal.q = "";
    const q = document.getElementById("m-q");
    if(q) q.value = "";
    majResultats();
    return;
  }
  if(act === "cat-modele"){
    capturerModal();
    const [ma, mo] = id.split("||");
    state.modal.marque = ma; state.modal.modele = mo; state.modal.etape = "moteur";
    render(); return;
  }
  if(act === "cat-moto"){
    const m = state.modal;
    const l = motosDe(m.marque, m.modele);
    const k = parseInt(id, 10);
    m.moto = k >= 0 ? l[k] : null;
    if(m.cible){
      const v = DB.vehicules[m.cible];
      if(v){ appliquerModele(v, m.marque, m.modele, m.moto); sauverVehicule(v); }
      fermerModal();
      toast(v ? nomVehicule(v) + " mis à jour" : "Véhicule introuvable");
      return;
    }
    m.etape = "infos";
    m.prixAuto = m.moto ? Math.round(m.moto.prix * coefFinition(m.marque, m.finition)) : 0;
    m.prix = m.prixAuto;
    if(!m.mec){
      // La date n'est pas connue, mais l'année de lancement du modèle est une
      // borne basse honnête : elle évite une saisie partie de rien.
      const a = anneesDe(m.marque, m.modele);
      if(a) m.mec = Math.max(a[0], Math.min(a[1], new Date().getFullYear() - 5)) + "-01-01";
    }
    render(); return;
  }
  if(act === "cat-manuel"){ capturerModal(); state.modal.etape = "manuel"; render(); return; }
  if(act === "cat-retour"){
    capturerModal();
    const m = state.modal;
    m.etape = m.etape === "infos" ? "moteur" : "modele";
    if(m.etape === "modele" && !m.q) m.marque = m.marque || "";
    render(); return;
  }
  if(act === "vehicule-ok"){
    capturerModal();
    const m = state.modal;
    if(m.etape === "manuel" && !(m.marque || "").trim() && !(m.modele || "").trim()){
      toast("Il faut au moins une marque ou un modèle"); return;
    }
    const v = creerVehicule({
      marque:(m.marque||"").trim(), modele:(m.modele||"").trim(),
      moto:m.etape === "manuel" ? null : m.moto, finition:m.finition || "",
      prixNeuf:m.prix || 0,
      version:m.etape === "manuel" ? (m.version||"").trim() : "",
      energie:m.etape === "manuel" ? m.energie : "",
      boite:m.boite, mec:m.mec, km:m.km });
    fermerModal();
    state.tab = "accueil"; render(); window.scrollTo(0,0);
    toast(nomVehicule(v) + " ajouté");
    return;
  }
  if(act === "vehicule-actif"){ DB.settings.actif = id; sauver(true); state.fiche = null; state.tab = "accueil"; render(); return; }
  if(act === "vehicule-supprimer"){ ouvrirModal({ type:"supprimer-vehicule", id }); return; }
  if(act === "vehicule-supprimer-ok"){
    const v = DB.vehicules[id];
    if(!v) return;
    corbeille = { vehicules:[JSON.parse(JSON.stringify(v))],
                  actes:actesDe(id).map(a => JSON.parse(JSON.stringify(a))) };
    actesDe(id).forEach(a => supprimerActeDB(a.id));
    supprimerVehiculeDB(id);
    if(DB.settings.actif === id) DB.settings.actif = (vehicules()[0] || {}).id || "";
    sauver(true);
    state.fiche = null; fermerModal();
    toast("Véhicule supprimé", "annuler-suppr");
    return;
  }
  if(act === "annuler-suppr"){
    if(!corbeille) return;
    (corbeille.vehicules||[]).forEach(v => { DB.vehicules[v.id] = v; sauverVehicule(v); });
    (corbeille.actes||[]).forEach(a => { DB.actes[a.id] = a; sauverActe(a); });
    if(!DB.settings.actif) DB.settings.actif = (corbeille.vehicules[0]||{}).id || "";
    corbeille = null; sauver(true);
    fermerToast(); render();
    toast("Rétabli");
    return;
  }
  if(act === "fiche-ok"){
    const v = DB.vehicules[id];
    if(!v) return;
    v.marque = val("f-marque").trim(); v.modele = val("f-modele").trim();
    v.version = val("f-version").trim(); v.finition = val("f-finition").trim();
    v.genre = val("f-genre");
    v.mec = val("f-mec"); v.energie = val("f-energie"); v.boite = val("f-boite");
    v.distrib = val("f-distrib"); v.regime = val("f-regime");
    v.km = Math.max(0, entier("f-km")); v.kmDate = val("f-kmdate") || todayISO();
    v.kmAn = Math.max(0, entier("f-kman"));
    v.revDate = val("f-revdate"); v.revKm = Math.max(0, entier("f-revkm"));
    v.ctDernier = val("f-ct"); v.ctResultat = val("f-ctres");
    v.prixNeuf = cents(val("f-neuf")); v.coteMan = cents(val("f-cote"));
    sauverVehicule(v);
    state.fiche = null; render();
    toast("Fiche enregistrée");
    return;
  }

  /* ---- kilométrage ---- */
  if(act === "relever-km"){
    const v = vActif();
    if(!v){ ouvrirModal({ type:"vehicule", etape:"modele", q:"", focus:"m-q" }); return; }
    ouvrirModal({ type:"km", km:kmAujourdhui(v), date:todayISO() });
    return;
  }
  if(act === "km-plus"){
    capturerModal();
    state.modal.km = (state.modal.km || 0) + (parseInt(id,10) || 0);
    render(); return;
  }
  if(act === "km-ok"){
    const v = vActif();
    capturerModal();
    const n = Math.max(0, state.modal.km || 0);
    if(n < (v.km||0)){
      // Un compteur ne recule pas : si le chiffre baisse, c'est une correction,
      // pas un relevé. On l'accepte, mais on le dit.
      toast("Compteur corrigé à la baisse");
    }
    v.km = n; v.kmDate = state.modal.date || todayISO();
    sauverVehicule(v); fermerModal();
    return;
  }

  /* ---- interventions ---- */
  if(act === "acte-nouveau"){ ouvrirModal({ type:"acte", ope:"", date:todayISO(), km:kmAujourdhui(vActif()) }); return; }
  if(act === "acte-depuis-ope"){
    const o = OPE(id);
    ouvrirModal({ type:"acte", ope:id, titre:o ? o.n : "", date:todayISO(),
                  km:kmAujourdhui(vActif()), cout:o ? brut(o.c*100) : "" });
    return;
  }
  if(act === "acte-modifier"){
    const a = DB.actes[id];
    if(!a) return;
    ouvrirModal({ type:"acte", id:a.id, ope:a.ope, titre:a.titre, date:a.date,
                  km:a.km, cout:brut(a.cout), note:a.note });
    return;
  }
  if(act === "acte-ok"){
    const v = vActif();
    capturerModal();
    const m = state.modal;
    const o = OPE(m.ope);
    const a = m.id ? DB.actes[m.id] : { id:uid(), vehicule:v.id, cree:Date.now() };
    if(!a) return;
    a.ope = m.ope || "";
    a.titre = (m.titre||"").trim() || (o ? o.n : (m.ope === "ct" ? "Contrôle technique" : "Intervention"));
    a.date = m.date || todayISO();
    a.km = Math.max(0, m.km || 0);
    a.cout = cents(m.cout);
    a.note = (m.note||"").trim();
    DB.actes[a.id] = a; sauverActe(a);
    // Une intervention plus récente que le dernier relevé avance le compteur.
    if(a.km > (v.km||0) && a.date >= (v.kmDate||"")){ v.km = a.km; v.kmDate = a.date; sauverVehicule(v); }
    // Un contrôle technique noté met à jour la date du dernier CT.
    if(a.ope === "ct" && (!v.ctDernier || a.date > v.ctDernier)){ v.ctDernier = a.date; v.ctResultat = "ok"; sauverVehicule(v); }
    fermerModal();
    toast(m.id ? "Intervention modifiée" : "Intervention notée");
    return;
  }
  if(act === "acte-supprimer"){
    const a = DB.actes[id];
    if(!a) return;
    corbeille = { vehicules:[], actes:[JSON.parse(JSON.stringify(a))] };
    supprimerActeDB(id);
    fermerModal();
    toast("Intervention supprimée", "annuler-suppr");
    return;
  }

  /* ---- opérations et intervalles ---- */
  if(act === "ope-ouvrir"){ if(OPE(id)) ouvrirModal({ type:"ope", k:id }); return; }
  if(act === "ope-regler"){ if(OPE(id)) ouvrirModal({ type:"ope", k:id }); return; }
  if(act === "ope-ok"){
    const v = vActif();
    const ik = entier("m-ik"), im = entier("m-im");
    v.plan = v.plan || {};
    v.plan[id] = { ...(v.plan[id]||{}), km:ik || "", mois:im || "", off:false };
    sauverVehicule(v); fermerModal();
    toast("Intervalle enregistré");
    return;
  }
  if(act === "ope-defaut"){
    const v = vActif();
    if(v.plan) delete v.plan[id];
    sauverVehicule(v); fermerModal();
    toast("Valeurs d'origine rétablies");
    return;
  }
  if(act === "ope-retirer"){
    const v = vActif();
    v.plan = v.plan || {};
    const etait = !!(v.plan[id] && v.plan[id].off);
    v.plan[id] = { ...(v.plan[id]||{}), off:!etait };
    sauverVehicule(v); fermerModal();
    toast(etait ? "Remis au plan" : "Retiré du plan");
    return;
  }

  /* ---- contrôle technique ---- */
  if(act === "ct-modifier"){ if(vActif()) ouvrirModal({ type:"ct" }); return; }
  if(act === "ct-ok"){
    const v = vActif();
    capturerModal();
    v.ctDernier = state.modal.ct || "";
    v.ctResultat = state.modal.res || "ok";
    sauverVehicule(v); fermerModal();
    return;
  }

  /* ---- valeur ---- */
  if(act === "cote-modifier"){ if(vActif()) ouvrirModal({ type:"cote" }); return; }
  if(act === "cote-ok"){
    const v = vActif();
    v.prixNeuf = cents(val("m-neuf"));
    v.coteMan = cents(val("m-cote"));
    sauverVehicule(v); fermerModal();
    return;
  }
  if(act === "cote-web"){
    const v = vActif();
    const q = [v.marque, v.modele, v.version, anneeDe(v.mec) || "", nb(kmAujourdhui(v)) + " km", "cote occasion"]
      .filter(Boolean).join(" ");
    window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank", "noopener");
    return;
  }

  /* ---- hypothèses ---- */
  if(act === "kman-defaut"){ ouvrirModal({ type:"kman" }); return; }
  if(act === "kman-set"){ const e = document.getElementById("m-kman"); if(e) e.value = id; return; }
  if(act === "kman-ok"){
    DB.settings.kmAn = Math.max(1000, entier("m-kman") || 13000);
    sauver(true); fermerModal();
    return;
  }

  /* ---- apparence ---- */
  if(act === "theme"){
    ecritLS(LSTHEME, id); appliquerTheme(id);
    DB.settings.theme = id; sauver(true); majIcone(); render(); return;
  }
  if(act === "accent"){
    ecritLS(LSACC, id); appliquerAccent(id);
    DB.settings.accent = id; sauver(true); majIcone(); render(); return;
  }

  /* ---- données ---- */
  if(act === "exporter"){ ouvrirModal({ type:"export" }); return; }
  if(act === "exporter-ok"){ fermerModal(); exporterJSON(id); return; }
  if(act === "importer"){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = () => { if(inp.files && inp.files[0]) importerFichier(inp.files[0]); };
    inp.click();
    return;
  }
  if(act === "effacer"){ ouvrirModal({ type:"effacer", focus:"m-conf" }); return; }
  if(act === "effacer-ok"){
    const v = (val("m-conf") || "").trim().toUpperCase();
    if(v !== "EFFACER"){ toast("Tape EFFACER pour confirmer"); return; }
    try{ await IDB.vider(); }catch(e){}
    DB = JSON.parse(JSON.stringify(DEFAULTS));
    DB.settings.theme = themeActuel(); DB.settings.accent = accentActuel();
    corbeille = null;
    state.fiche = null; state.tab = "accueil";
    fermerModal(); window.scrollTo(0,0);
    toast("Tout a été effacé");
    return;
  }
});

  majResultats();
});

/* Les listes déroulantes d'une modale la redessinent : le choix d'une
   opération change l'intitulé et le coût proposés. */
document.addEventListener("change", ev => {
  const e = ev.target;
  if(!state.modal) return;
  if(e.id === "m-ope"){
    capturerModal();
    const o = OPE(state.modal.ope);
    if(o){
      if(!state.modal.titre || OPES.some(x => x.n === state.modal.titre)) state.modal.titre = o.n;
      if(!state.modal.cout) state.modal.cout = brut(o.c*100);
    }
    render();
  }
  if(e.id === "m-ctres" || e.id === "m-ct"){ capturerModal(); render(); }
  if(e.id === "m-finition"){
    capturerModal();
    const m = state.modal;
    const auto = m.moto ? Math.round(m.moto.prix * coefFinition(m.marque, m.finition)) : 0;
    // Un prix corrigé à la main ne se fait pas effacer par un changement de finition.
    if(!m.prix || m.prix === m.prixAuto) m.prix = auto;
    m.prixAuto = auto;
    render();
  }
});

/* ============================================================
   EXPORT ET IMPORT
   ============================================================ */
function filtrerPortee(obj, portee, cle){
  const r = {};
  Object.entries(obj).forEach(([k,v]) => {
    if(portee === "tout" || (cle ? v[cle] === portee : k === portee)) r[k] = v;
  });
  return r;
}
function contenuSauvegarde(portee){
  const p = portee || "tout";
  return JSON.stringify({ app:"carnet", appVersion:VERSION, schema:SCHEMA, portee:p,
    vehicules:filtrerPortee(DB.vehicules, p, null),
    actes:filtrerPortee(DB.actes, p, "vehicule"),
    settings:DB.settings, meta:DB.meta }, null, 2);
}
function telecharger(nom, blob){
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = u; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function exporterJSON(portee){
  const p = portee || "tout";
  const d = new Date();
  const v = DB.vehicules[p];
  const suffixe = v ? "-" + normTexte(nomVehicule(v)).replace(/ /g,"-") : "";
  const nom = "carnet" + suffixe + "-" + d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + ".json";
  telecharger(nom, new Blob([contenuSauvegarde(p)], { type:"application/json" }));
  DB.meta.exporte = Date.now(); sauver(true); render();
  const nv = v ? 1 : vehicules().length;
  const na = Object.keys(filtrerPortee(DB.actes, p, "vehicule")).length;
  toast(nv + (nv > 1 ? " véhicules et " : " véhicule et ") + na +
        (na > 1 ? " interventions exportés" : " intervention exportée"));
}
async function importerFichier(f){
  try{
    const x = JSON.parse(await f.text());
    const r = fusionnerSauvegarde(x);
    render();
    toast(r.nv + (r.nv > 1 ? " véhicules et " : " véhicule et ") + r.na +
          (r.na > 1 ? " interventions ajoutés" : " intervention ajoutée"));
  }catch(e){
    toast("Fichier illisible : " + ((e && e.message) || e));
  }
}

/* ============================================================
   ICÔNE ET MANIFESTE, PEINTS À LA COULEUR D'ACCENT
   ============================================================ */
function dessinerIcone(taille, marge){
  const c = document.createElement("canvas");
  c.width = c.height = taille;
  const x = c.getContext("2d");
  const acc = accentActuel();
  // « maskable » : Android rogne l'icône en cercle ou en écusson selon le
  // téléphone. On peint alors tout le carré et on garde le sigle au centre.
  const p = marge ? taille * 0.12 : 0;
  const t = taille - p * 2, r = t * 0.22;
  x.fillStyle = acc;
  if(marge) x.fillRect(0, 0, taille, taille);
  else{
    x.beginPath();
    x.moveTo(r, 0); x.arcTo(t, 0, t, t, r); x.arcTo(t, t, 0, t, r);
    x.arcTo(0, t, 0, 0, r); x.arcTo(0, 0, t, 0, r); x.closePath();
    x.fill();
  }
  const u = t / 64, o = p;
  x.strokeStyle = surAccent(acc);
  x.lineCap = "round"; x.lineWidth = 5 * u;
  x.beginPath();
  x.arc(o + 32*u, o + 44*u, 16*u, Math.PI, 2*Math.PI);
  x.stroke();
  x.beginPath();
  x.moveTo(o + 32*u, o + 44*u); x.lineTo(o + 42.5*u, o + 29.5*u);
  x.stroke();
  return c.toDataURL("image/png");
}
let _manifeste = null;
function majIcone(){
  try{
    const acc = accentActuel(), sur = surAccent(acc);
    const fav = document.getElementById("favicon");
    if(fav) fav.href = "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
      '<rect width="64" height="64" rx="14" fill="' + acc + '"/>' +
      '<path d="M16 44a16 16 0 1 1 32 0M32 44 42.5 29.5" fill="none" stroke="' + sur + '" ' +
      'stroke-width="5" stroke-linecap="round"/></svg>');

    const p192 = dessinerIcone(192, false), p512 = dessinerIcone(512, false), pm = dessinerIcone(512, true);
    let at = document.querySelector('link[rel="apple-touch-icon"]');
    if(!at){ at = document.createElement("link"); at.rel = "apple-touch-icon"; document.head.appendChild(at); }
    at.href = p192;

    const man = {
      id:"carnet", name:"Carnet", short_name:"Carnet", start_url:".", scope:".",
      display:"standalone", orientation:"portrait",
      background_color: themeActuel() === "sombre" ? "#0d0d10" : "#ffffff",
      theme_color: themeActuel() === "sombre" ? "#0d0d10" : "#ffffff",
      icons:[ { src:p192, sizes:"192x192", type:"image/png" },
              { src:p512, sizes:"512x512", type:"image/png" },
              { src:pm,  sizes:"512x512", type:"image/png", purpose:"maskable" } ]
    };
    if(_manifeste) URL.revokeObjectURL(_manifeste);
    _manifeste = URL.createObjectURL(new Blob([JSON.stringify(man)], { type:"application/manifest+json" }));
    let lm = document.querySelector('link[rel="manifest"]');
    if(!lm){ lm = document.createElement("link"); lm.rel = "manifest"; document.head.appendChild(lm); }
    lm.href = _manifeste;
  }catch(e){ /* une icône ratée ne doit pas empêcher l'application de tourner */ }
}

/* ---------- espace disque ---------- */
async function majQuota(){
  if(!navigator.storage || !navigator.storage.estimate) return;
  try{
    state.quota = await navigator.storage.estimate();
    if(pret && state.tab === "reglages") render();
  }catch(e){}
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
async function demarrer(){
  try{
    await IDB.ouvrir();
    DB = assembler(await IDB.tout());
  }catch(e){
    document.getElementById("view").innerHTML =
      '<div class="vide" style="margin-top:60px"><b>Stockage indisponible</b>' +
      esc(String((e && e.message) || e)) + '<br>La navigation privée de certains navigateurs interdit IndexedDB.</div>';
    return;
  }
  pret = true;

  if(!litLS(LSTHEME) && DB.settings.theme){ ecritLS(LSTHEME, DB.settings.theme); appliquerTheme(DB.settings.theme); }
  if(!litLS(LSACC) && DB.settings.accent){ ecritLS(LSACC, DB.settings.accent); appliquerAccent(DB.settings.accent); }
  DB.settings.theme = themeActuel();
  DB.settings.accent = accentActuel();
  if(!DB.vehicules[DB.settings.actif]) DB.settings.actif = (vehicules()[0] || {}).id || "";

  state.neuf = DB.meta.vue !== VERSION;
  render();
  majIcone();
  majQuota();
}

/* Un téléphone rouvert le lendemain doit redater les échéances sans qu'on ait
   besoin de recharger la page. */
let _jour = todayISO();
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible" || !pret) return;
  if(_jour !== todayISO()){ _jour = todayISO(); render(); }
});
window.addEventListener("pagehide", () => { ecouler(); });

demarrer();
</script>
